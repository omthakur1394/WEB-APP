<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus • Advanced AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="bg-gradient-spot spot-1"></div>
  <div class="bg-gradient-spot spot-2"></div>
  <div class="bg-grid"></div>

  <div class="app-container">
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo-box">
          <i data-lucide="hexagon" class="logo-icon"></i>
        </div>
        <h2>Nexus</h2>
      </div>

      <div class="sidebar-actions">
        <button id="new-chat-btn" class="btn-primary">
          <i data-lucide="plus"></i>
          <span>New Chat</span>
        </button>
      </div>

      <div class="session-info">
        <span class="label">Current Session</span>
        <div class="thread-badge">
          <i data-lucide="hash" class="sm-icon"></i>
          <span id="thread-id-display">Connecting...</span>
        </div>
      </div>

      <!-- ADDED: Chat History Section -->
      <div class="history-section">
        <span class="label">Chat History</span>
        <div id="chat-history-list" class="chat-history-list">
          <div class="history-empty">No history yet</div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <div class="status-dot"></div>
          System Online
        </div>
      </div>
    </nav>

    <main class="chat-layout">
      <header class="mobile-header">
        <div class="logo-box-mobile">
          <i data-lucide="hexagon"></i> Nexus
        </div>
        <button id="mobile-new-chat" class="btn-icon">
          <i data-lucide="plus"></i>
        </button>
      </header>

      <div id="chat-container">
        <div class="welcome-view">
          <div class="welcome-icon">
            <i data-lucide="bot"></i>
          </div>
          <h1>How can I assist you?</h1>
          <p>I am connected to your secure API and ready to help.</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="message-input" placeholder="Ask anything..." rows="1" autofocus></textarea>
          <button id="voice-btn" class="voice-btn" type="button" title="Start voice conversation" aria-label="Start voice conversation">
            <i data-lucide="mic"></i>
          </button>
          <button id="send-btn" class="send-btn" disabled title="Send message">
            <i data-lucide="arrow-up"></i>
          </button>
        </div>
        <div id="voice-status" class="voice-status" aria-live="polite"></div>
        <div class="input-disclaimer">
          Nexus can make mistakes. Consider verifying important information.
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
  <script>lucide.createIcons();</script>
</body>

</html>
